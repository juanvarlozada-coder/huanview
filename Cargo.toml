[package]
name = "huanview"
version = "0.1.2"
edition = "2021"
description = "Minimalist fast image viewer inspired by Gwenview"
license = "MIT"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
fast_image_resize = "3"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
