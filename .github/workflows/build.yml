name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin dist
          cp target/release/huanview AppDir/usr/bin/
          cp packaging/appimage/huanview.desktop AppDir/
          cp packaging/appimage/huanview.png AppDir/
          curl -sSL -o /tmp/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o /tmp/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/linuxdeploy /tmp/appimagetool
          sudo apt-get install -y appstream
          /tmp/linuxdeploy --appimage-extract-and-run --appdir AppDir --executable AppDir/usr/bin/huanview --desktop-file AppDir/huanview.desktop --icon-file AppDir/huanview.png
          /tmp/appimagetool --appimage-extract-and-run AppDir "dist/Huanview-${GITHUB_REF_NAME#v}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/*.AppImage" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-gnu }
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: NSIS installer
        run: |
          mkdir dist -Force
          & choco install nsis -y --no-progress 2>$null
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          If (-not (Test-Path $makensis)) { $makensis = "C:\Program Files\NSIS\makensis.exe" }
          & $makensis packaging\windows\installer.nsi
        shell: pwsh
      - name: Portable zip
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-gnu/release/huanview.exe,packaging/windows/icon.ico -DestinationPath "dist/Huanview-$($env:GITHUB_REF_NAME.Replace('v',''))-portable-win64.zip"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*" }

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/*
            windows/*
